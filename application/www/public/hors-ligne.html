<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#002b7f">
    <title>Hors ligne · FO Gestion</title>
    <style>
        :root { color-scheme: light dark; --bg: #f3f5fa; --ink: #0e1726; --muted: #46536a; --brand: #002b7f; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0a1120; --ink: #e9eef7; --muted: #a9b5ca; --brand: #9db8ff; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 Carlito, Calibri, "Segoe UI", system-ui, sans-serif; padding: 1.5rem; }
        main { max-width: 32rem; }
        .logo { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: .75rem; background: #002b7f; color: #fff; font-weight: 700; font-size: 1.25rem; }
        h1 { font-size: 1.875rem; margin: 1rem 0 .5rem; }
        p { color: var(--muted); }
        button { min-height: 2.75rem; padding: .5rem 1rem; border-radius: .75rem; border: 2px solid var(--brand); background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        @media (prefers-color-scheme: dark) { button { color: #071023; } }
        button:focus-visible { outline: 3px solid #ffd24d; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <span class="logo" aria-hidden="true">FO</span>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n’a pas encore été consultée sur cet appareil. Les pages déjà ouvertes restent lisibles sans connexion ; les saisies demandent une connexion.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
