; =====================================================================
; ForceOS : php.ini embarqué de FO Gestion
; Conçu par Florian Bigotte pour Force Ouvrière
;
; Chargé par main.js via « php-cgi -c php.ini ». Les extensions (openssl,
; sodium, curl, gd, imagick, intl, zip, xml, mbstring, iconv, mysqli,
; pdo_mysql) sont fournies par les paquets Debian et chargées par le
; répertoire conf.d standard. Ce fichier a un seul rôle : DURCIR
; l'interpréteur. Les chemins propres au militant (open_basedir,
; temporaires, journal) sont injectés au lancement par -d.
; FO Gestion 3 n'utilise aucune des fonctions interdites ci-dessous.
; =====================================================================

[PHP]
engine = On
expose_php = Off
short_open_tag = Off
zend.assertions = -1

; Erreurs : jamais à l'écran, toujours dans le journal du militant
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_reporting = E_ALL

; Ressources. L'audio des réunions ne passe pas par PHP (processus
; principal) : les envois se limitent aux documents, imports et photos.
memory_limit = 512M
max_execution_time = 300
max_input_time = 120
file_uploads = On
upload_max_filesize = 60M
post_max_size = 64M
max_file_uploads = 10
max_input_vars = 3000
max_input_nesting_level = 32

; PHP2Shell (CVE-2026-109619 et CVE-2026-115560) : le suivi de progression
; des envois, actif par défaut et sans utilité ici, est désactivé. Il était
; la voie d'exploitation confirmée, même sans session ouverte.
session.upload_progress.enabled = 0
session.use_strict_mode = 1
session.serialize_handler = php

; Réseau : aucune inclusion distante, téléchargements via cURL uniquement
allow_url_fopen = Off
allow_url_include = Off

; Fonctions interdites. phpinfo est bloquée car elle afficherait les
; variables d'environnement (jetons, clé maîtresse).
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,dl,putenv,phpinfo,show_source,highlight_file,link,symlink

default_charset = "UTF-8"
date.timezone = "Europe/Paris"

; Certificats système pour cURL et OpenSSL (flux RSS, cours de bourse)
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

[MySQLi]
mysqli.allow_local_infile = Off

[opcache]
; php-cgi lance un processus par requête : le cache est gardé sur disque
; (opcache.file_cache, dans le dossier du militant, ajouté au lancement)
; et JAMAIS en mémoire partagée entre processus, mémoire visée par la
; confusion de type d'OPcache décrite avec PHP2Shell.
opcache.enable = 1
opcache.enable_cli = 0
opcache.file_cache_only = 1
opcache.file_cache_consistency_checks = 1
opcache.validate_timestamps = 1
