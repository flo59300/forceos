# =====================================================================
# ForceOS : réponses automatiques de l'installateur Debian
# Conçu et développé par Florian Bigotte pour Force Ouvrière
#
# Restent posées à la personne qui installe (volontairement) :
#   - le disque à utiliser (tout son contenu est effacé) ;
#   - la phrase de chiffrement du disque (LUKS) ;
#   - le mot de passe administrateur (root), gardé par Florian ;
#   - le nom et le mot de passe du militant qui utilisera le poste.
# Le militant n'est PAS administrateur : les actions sensibles (mises à
# jour, consignes de l'IA, clés USB) demandent le mot de passe root.
# =====================================================================

# --- Langue, clavier, fuseau horaire ---
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i localechooser/supported-locales multiselect fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/layoutcode string fr
d-i keyboard-configuration/variantcode string latin9
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Support d'installation ---
# L'image est copiée sur une clé USB : l'installateur doit aussi chercher
# le support sur les périphériques USB, pas seulement sur un lecteur de CD.
d-i cdrom-detect/try-usb boolean true

# --- Réseau ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string forceos
d-i netcfg/get_domain string
d-i netcfg/hostname string forceos
d-i hw-detect/load_firmware boolean true

# --- Miroir (mises à jour de sécurité après installation) ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# --- Comptes ---
# Mot de passe root demandé (administrateur : Florian) ; pas de sudo pour le militant.
d-i passwd/root-login boolean true
d-i passwd/make-user boolean true
d-i passwd/user-default-groups string audio cdrom video plugdev netdev lpadmin scanner bluetooth
d-i user-setup/encrypt-home boolean false
d-i user-setup/allow-password-weak boolean false

# --- Partitionnement : disque entier chiffré (LUKS2 + LVM) ---
# La phrase de chiffrement est demandée à l'écran : elle n'est jamais écrite ici.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string forceos
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-crypto/erase_data boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Pas de partition d'échange sur disque : zram en mémoire (rien ne fuit sur le disque)
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-auto/expert_recipe string                         \
      forceos ::                                              \
        538 538 1075 free                                     \
          $iflabel{ gpt } $reusemethod{ } method{ efi }       \
          format{ } .                                         \
        1024 1024 1024 ext4                                   \
          $primary{ } $bootable{ } method{ format } format{ } \
          use_filesystem{ } filesystem{ ext4 }                \
          mountpoint{ /boot } .                               \
        20000 30000 -1 ext4                                   \
          $lvmok{ } lv_name{ racine } in_vg{ forceos }        \
          method{ format } format{ } use_filesystem{ }        \
          filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select forceos

# --- Paquets : le système est copié depuis l'image, rien n'est ajouté ---
tasksel tasksel/first multiselect
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false

# --- Chargeur de démarrage ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# --- Fin d'installation ---
# Le compte créé (UID 1000) devient le seul autorisé à ouvrir FO Gestion ;
# la base de données est préparée au premier démarrage (forceos-premier-demarrage).
# Le compte de démonstration du système autonome est supprimé s'il a été copié.
d-i preseed/late_command string \
  in-target sh -c 'mkdir -p /etc/forceos && getent passwd 1000 | cut -d: -f1 > /etc/forceos/utilisateur-autorise && chown root:root /etc/forceos/utilisateur-autorise && chmod 0644 /etc/forceos/utilisateur-autorise'; \
  in-target sh -c 'userdel -r user 2>/dev/null || true; rm -f /etc/sudoers.d/live 2>/dev/null || true'; \
  in-target sh -c 'apt-get purge -y debian-installer-launcher 2>/dev/null || true'; \
  in-target systemctl enable forceos-premier-demarrage.service; \
  in-target update-initramfs -u -k all
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
