# ForceOS : apparence de l'écran de connexion (Florian Bigotte)
[greeter]
background=/usr/share/backgrounds/forceos/forceos-fond-1920x1080.png
user-background=false
theme-name=Greybird
icon-theme-name=elementary-xfce
font-name=Carlito 12
xft-antialias=true
xft-hintstyle=hintslight
default-user-image=/usr/share/icons/hicolor/128x128/apps/forceos.png
# Fenêtre de connexion à gauche : le logo du fond d'écran reste visible à droite
position=22%,center 48%,center
indicators=~host;~spacer;~clock;~spacer;~language;~a11y;~power
clock-format=%A %d %B, %H:%M
hide-user-image=false
round-user-image=false
