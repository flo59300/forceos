# ForceOS : écran de connexion à la manière de Linux Mint (Florian Bigotte)
[Greeter]
background=/usr/share/backgrounds/forceos/forceos-fond-1920x1080.png
draw-user-backgrounds=false
draw-grid=false
theme-name=Mint-Y-Dark-Blue
icon-theme-name=Mint-Y-Blue
cursor-theme-name=Bibata-Modern-Classic
font-name=Carlito 12
xft-antialias=true
xft-hintstyle=hintslight
# Pas de logo : le fond d'écran porte déjà celui de FO (image transparente)
logo=/usr/share/forceos/images/transparent.png
background-color=#002B7F
show-hostname=false
show-a11y=true
show-power=true
show-keyboard=true
show-clock=true
clock-format=%A %d %B, %H:%M
activate-numlock=true
