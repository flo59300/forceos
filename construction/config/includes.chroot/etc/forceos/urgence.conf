# Applications fermées immédiatement, sans enregistrement
# (noms de processus ; FO Gestion est toujours fermée)
APPLICATIONS="librewolf soffice.bin scribus evince foliate pdfarranger ristretto vlc rustdesk thunderbird"

# Après fermeture : « verrouiller » (écran verrouillé, session conservée)
# ou « eteindre » (arrêt complet : le disque redevient illisible sans sa phrase)
ACTION_FINALE="verrouiller"
