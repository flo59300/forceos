# =====================================================================
# ForceOS : démarrage sans menu ni logo Debian (Florian Bigotte)
# Le menu GRUB est caché (touche Échap au démarrage pour l'afficher en cas
# de dépannage) ; l'écran ForceOS (Plymouth) s'affiche directement et
# demande la phrase de chiffrement du disque.
# =====================================================================
GRUB_DISTRIBUTOR="ForceOS"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_RECORDFAIL_TIMEOUT=0
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0"
GRUB_BACKGROUND=""
GRUB_TERMINAL_OUTPUT="console"
