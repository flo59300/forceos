#!/usr/sbin/nft -f
# =====================================================================
# ForceOS : pare-feu du poste
# Conçu et développé par Florian Bigotte pour Force Ouvrière
#
# Entrant : tout est rejeté, sauf le strict nécessaire au réseau.
# Sortant : libre, sauf
#   - le DNS (53, 853), autorisé uniquement vers le résolveur filtrant ;
#   - les ports RustDesk, ouverts seulement vers le serveur de Florian
#     pendant une session d'assistance.
# =====================================================================
flush ruleset

table inet forceos {

  # Résolveur DNS filtrant (CleanBrowsing, filtre « Adult »)
  set dns_filtre_v4 { type ipv4_addr; elements = { 185.228.168.10, 185.228.169.11 } }
  set dns_filtre_v6 { type ipv6_addr; elements = { 2a0d:2a00:1::1, 2a0d:2a00:2::1 } }

  # Serveur d'assistance, avec expiration automatique
  set support_v4 { type ipv4_addr; flags timeout; }
  set support_v6 { type ipv6_addr; flags timeout; }

  chain entree {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state invalid drop
    ct state established,related accept

    meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded,
      parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

    # Découverte des imprimantes du réseau local (AirPrint, IPP Everywhere)
    ip  daddr 224.0.0.251 udp dport 5353 accept
    ip6 daddr ff02::fb    udp dport 5353 accept
  }

  chain sortie {
    type filter hook output priority filter; policy accept;

    oif "lo" accept

    # DNS : uniquement vers le résolveur filtrant
    meta l4proto { tcp, udp } th dport { 53, 853 } ip  daddr @dns_filtre_v4 accept
    meta l4proto { tcp, udp } th dport { 53, 853 } ip6 daddr @dns_filtre_v6 accept
    meta l4proto { tcp, udp } th dport { 53, 853 } drop

    # Assistance active : flux autorisé vers le seul serveur de Florian
    ip  daddr @support_v4 accept
    ip6 daddr @support_v6 accept

    # Hors assistance : RustDesk ne peut joindre aucun serveur
    tcp dport 21115-21119 drop
    udp dport 21116 drop
  }

  chain transit {
    type filter hook forward priority filter; policy drop;
  }
}
